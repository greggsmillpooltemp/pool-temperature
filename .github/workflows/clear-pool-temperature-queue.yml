name: Clear Pool Temperature Queue

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  clear-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale pool temperature runs
        shell: pwsh
        env:
          WORKFLOW_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WORKFLOW_DISPATCH_TOKEN)) {
            throw "WORKFLOW_DISPATCH_TOKEN is not set."
          }

          $headers = @{
            "Accept" = "application/vnd.github+json"
            "Authorization" = "Bearer $env:WORKFLOW_DISPATCH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $runs = Invoke-RestMethod `
            -Method Get `
            -Uri "https://api.github.com/repos/$env:GH_REPOSITORY/actions/workflows/pool-temperature.yml/runs?status=queued&per_page=100" `
            -Headers $headers

          $runs.workflow_runs | ForEach-Object {
            Write-Host "Cancelling queued run #$($_.run_number) ($($_.id))"
            Invoke-RestMethod `
              -Method Post `
              -Uri "https://api.github.com/repos/$env:GH_REPOSITORY/actions/runs/$($_.id)/cancel" `
              -Headers $headers
          }

          $runs = Invoke-RestMethod `
            -Method Get `
            -Uri "https://api.github.com/repos/$env:GH_REPOSITORY/actions/workflows/pool-temperature.yml/runs?status=in_progress&per_page=100" `
            -Headers $headers

          $runs.workflow_runs | ForEach-Object {
            Write-Host "Cancelling in-progress run #$($_.run_number) ($($_.id))"
            Invoke-RestMethod `
              -Method Post `
              -Uri "https://api.github.com/repos/$env:GH_REPOSITORY/actions/runs/$($_.id)/cancel" `
              -Headers $headers
          }
