name: Clear Pool Temperature Queue

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  clear-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale pool temperature runs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "GitHub token is not available."
          }

          $headers = @{
            "Accept" = "application/vnd.github+json"
            "Authorization" = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          function Stop-Run($Run) {
            try {
              Write-Host "Cancelling $($Run.status) run #$($Run.run_number) ($($Run.id))"
              Invoke-RestMethod `
                -Method Post `
                -Uri "https://api.github.com/repos/$env:GH_REPOSITORY/actions/runs/$($Run.id)/cancel" `
                -Headers $headers | Out-Null
            } catch {
              $body = $_.ErrorDetails.Message
              if (-not $body) { $body = $_.Exception.Message }
              Write-Warning "Could not cancel run #$($Run.run_number): $body"
            }
          }

          $runs = Invoke-RestMethod `
            -Method Get `
            -Uri "https://api.github.com/repos/$env:GH_REPOSITORY/actions/workflows/pool-temperature.yml/runs?per_page=100" `
            -Headers $headers

          $staleRuns = $runs.workflow_runs | Where-Object {
            $_.status -in @("queued", "in_progress", "pending", "waiting", "requested")
          }

          if (-not $staleRuns) {
            Write-Host "No queued or running pool temperature workflows found."
            exit 0
          }

          $staleRuns | ForEach-Object { Stop-Run $_ }
