name: Update Pool Temperature

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Force a Govee refresh even if the published data is fresh"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "17,47 * * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Govee auth cache
        uses: actions/cache/restore@v4
        with:
          path: .govee-auth
          key: govee-auth-${{ github.run_id }}
          restore-keys: |
            govee-auth-

      - name: Check Govee cooldown
        id: govee_cooldown
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path ".govee-auth" -Force | Out-Null
          $cachePath = ".govee-auth\auth.json"
          if (-not (Test-Path -LiteralPath $cachePath)) {
            "can_refresh=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          try {
            $cache = Get-Content -LiteralPath $cachePath -Raw | ConvertFrom-Json
            if ($cache.blockedUntil) {
              $blockedUntil = [DateTimeOffset]::Parse([string]$cache.blockedUntil)
              if ($blockedUntil -gt [DateTimeOffset]::UtcNow) {
                Write-Host "Govee refresh is cooling down until $($blockedUntil.ToString("u"))."
                "can_refresh=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                exit 0
              }
            }
          } catch {
            Write-Warning "Could not inspect Govee auth cache: $($_.Exception.Message)"
          }

          "can_refresh=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check whether live data needs refresh
        id: freshness
        if: steps.govee_cooldown.outputs.can_refresh == 'true'
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_REFRESH: ${{ inputs.force_refresh || 'false' }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:EVENT_NAME -eq "workflow_dispatch" -and $env:FORCE_REFRESH -eq "true") {
            "should_update=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Manual forced refresh requested, refreshing now."
            exit 0
          }

          try {
            $cacheBust = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
            $live = Invoke-RestMethod -Uri "https://greggsmillpooltemp.github.io/pool-temperature/pool-temperature.json?cachebust=$cacheBust"
            $updatedAt = [DateTimeOffset]::Parse([string]$live.updatedAt)
            $ageMinutes = ([DateTimeOffset]::UtcNow - $updatedAt.ToUniversalTime()).TotalMinutes
            Write-Host ("Live pool temperature data age: {0:n1} minutes." -f $ageMinutes)

            if ($ageMinutes -lt 55) {
              "should_update=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Host "Live data is fresh enough; skipping this run."
              exit 0
            }
          } catch {
            Write-Warning "Could not check live data freshness: $($_.Exception.Message)"
          }

          "should_update=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Update pool temperature
        if: steps.govee_cooldown.outputs.can_refresh == 'true' && steps.freshness.outputs.should_update == 'true'
        shell: pwsh
        run: |
          .\update-pool-temperature.ps1 `
            -Email "${{ secrets.GOVEE_EMAIL }}" `
            -Password "${{ secrets.GOVEE_PASSWORD }}" `
            -Code "${{ secrets.GOVEE_CODE }}" `
            -AuthCachePath ".govee-auth\auth.json"

      - name: Save Govee auth cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .govee-auth
          key: govee-auth-${{ github.run_id }}

      - name: Configure Pages
        if: steps.freshness.outputs.should_update == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.freshness.outputs.should_update == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: steps.freshness.outputs.should_update == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
