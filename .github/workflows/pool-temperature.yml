name: Update Pool Temperature

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 330
    concurrency:
      group: pool-temperature-update
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update pool temperature and keep Govee session
        shell: pwsh
        run: |
          .\update-pool-temperature.ps1 `
            -Email "${{ secrets.GOVEE_EMAIL }}" `
            -Password "${{ secrets.GOVEE_PASSWORD }}" `
            -Code "${{ secrets.GOVEE_CODE }}" `
            -ExportAuthEnvironment

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Wait for hour 2
        shell: pwsh
        run: Start-Sleep -Seconds 3600

      - name: Update pool temperature hour 2
        shell: pwsh
        run: |
          .\update-pool-temperature.ps1 `
            -Email "${{ secrets.GOVEE_EMAIL }}" `
            -AuthToken "$env:GOVEE_AUTH_TOKEN" `
            -ClientId "$env:GOVEE_CLIENT_ID"

      - name: Upload Pages artifact hour 2
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-${{ github.run_id }}-hour-2

      - name: Deploy to GitHub Pages hour 2
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-hour-2

      - name: Wait for hour 3
        shell: pwsh
        run: Start-Sleep -Seconds 3600

      - name: Update pool temperature hour 3
        shell: pwsh
        run: |
          .\update-pool-temperature.ps1 `
            -Email "${{ secrets.GOVEE_EMAIL }}" `
            -AuthToken "$env:GOVEE_AUTH_TOKEN" `
            -ClientId "$env:GOVEE_CLIENT_ID"

      - name: Upload Pages artifact hour 3
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-${{ github.run_id }}-hour-3

      - name: Deploy to GitHub Pages hour 3
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-hour-3

      - name: Wait for hour 4
        shell: pwsh
        run: Start-Sleep -Seconds 3600

      - name: Update pool temperature hour 4
        shell: pwsh
        run: |
          .\update-pool-temperature.ps1 `
            -Email "${{ secrets.GOVEE_EMAIL }}" `
            -AuthToken "$env:GOVEE_AUTH_TOKEN" `
            -ClientId "$env:GOVEE_CLIENT_ID"

      - name: Upload Pages artifact hour 4
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-${{ github.run_id }}-hour-4

      - name: Deploy to GitHub Pages hour 4
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-hour-4

      - name: Wait for hour 5
        shell: pwsh
        run: Start-Sleep -Seconds 3600

      - name: Update pool temperature hour 5
        shell: pwsh
        run: |
          .\update-pool-temperature.ps1 `
            -Email "${{ secrets.GOVEE_EMAIL }}" `
            -AuthToken "$env:GOVEE_AUTH_TOKEN" `
            -ClientId "$env:GOVEE_CLIENT_ID"

      - name: Upload Pages artifact hour 5
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-${{ github.run_id }}-hour-5

      - name: Deploy to GitHub Pages hour 5
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-hour-5

      - name: Wait for hour 6
        shell: pwsh
        run: Start-Sleep -Seconds 3600

      - name: Update pool temperature hour 6
        shell: pwsh
        run: |
          .\update-pool-temperature.ps1 `
            -Email "${{ secrets.GOVEE_EMAIL }}" `
            -AuthToken "$env:GOVEE_AUTH_TOKEN" `
            -ClientId "$env:GOVEE_CLIENT_ID"

      - name: Upload Pages artifact hour 6
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-${{ github.run_id }}-hour-6

      - name: Deploy to GitHub Pages hour 6
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-hour-6

  restart-updater:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    needs: update-and-deploy
    steps:
      - name: Start next updater run
        shell: pwsh
        env:
          WORKFLOW_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WORKFLOW_DISPATCH_TOKEN)) {
            throw "WORKFLOW_DISPATCH_TOKEN is not set, so this run cannot start the next updater run."
          }

          $headers = @{
            "Accept" = "application/vnd.github+json"
            "Authorization" = "Bearer $env:WORKFLOW_DISPATCH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{ ref = "main" } | ConvertTo-Json -Compress
          Invoke-RestMethod `
            -Method Post `
            -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pool-temperature.yml/dispatches" `
            -Headers $headers `
            -Body $body `
            -ContentType "application/json"
