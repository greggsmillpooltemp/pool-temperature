name: Update Pool Temperature

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Force a Govee refresh even if the published data is fresh"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      keep_alive:
        description: "Start the next updater run after this one finishes"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    - cron: "13 */6 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pool-temperature
  cancel-in-progress: false

jobs:
  update-and-deploy:
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether live data needs refresh
        id: freshness
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_REFRESH: ${{ inputs.force_refresh || 'false' }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:EVENT_NAME -eq "workflow_dispatch" -and $env:FORCE_REFRESH -eq "true") {
            "should_update=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Manual forced refresh requested, refreshing now."
            exit 0
          }

          try {
            $cacheBust = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
            $live = Invoke-RestMethod -Uri "https://greggsmillpooltemp.github.io/pool-temperature/pool-temperature.json?cachebust=$cacheBust"
            $updatedAt = [DateTimeOffset]::Parse([string]$live.updatedAt)
            $ageMinutes = ([DateTimeOffset]::UtcNow - $updatedAt.ToUniversalTime()).TotalMinutes
            Write-Host ("Live pool temperature data age: {0:n1} minutes." -f $ageMinutes)

            if ($ageMinutes -lt 115) {
              "should_update=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Host "Live data is fresh enough; skipping this run."
              exit 0
            }
          } catch {
            Write-Warning "Could not check live data freshness: $($_.Exception.Message)"
          }

          "should_update=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Update pool temperature
        if: steps.freshness.outputs.should_update == 'true'
        shell: pwsh
        run: |
          .\update-pool-temperature.ps1 `
            -Email "${{ secrets.GOVEE_EMAIL }}" `
            -Password "${{ secrets.GOVEE_PASSWORD }}" `
            -Code "${{ secrets.GOVEE_CODE }}"

      - name: Configure Pages
        if: steps.freshness.outputs.should_update == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.freshness.outputs.should_update == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: steps.freshness.outputs.should_update == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Start next updater run
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && (github.event_name == 'schedule' || inputs.keep_alive == 'true') }}
        shell: pwsh
        env:
          DISPATCH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_FILE: pool-temperature.yml
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:DISPATCH_TOKEN) {
            throw "GitHub did not provide a dispatch token for this run."
          }

          Write-Host "Waiting 30 minutes before starting the next updater run."
          Start-Sleep -Seconds 1800

          $headers = @{
            Authorization = "Bearer $env:DISPATCH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{
            ref = "main"
            inputs = @{
              force_refresh = "false"
              keep_alive = "true"
            }
          } | ConvertTo-Json -Depth 5

          $dispatchUri = "https://api.github.com/repos/$env:REPOSITORY/actions/workflows/$env:WORKFLOW_FILE/dispatches"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-RestMethod `
                -Method Post `
                -Uri $dispatchUri `
                -Headers $headers `
                -Body $body `
                -ContentType "application/json"

              Write-Host "Next updater run dispatched."
              exit 0
            } catch {
              Write-Warning "Could not dispatch next updater run on attempt $attempt`: $($_.Exception.Message)"
              if ($attempt -eq 3) {
                throw
              }
              Start-Sleep -Seconds (30 * $attempt)
            }
          }
