name: Update Pool Temperature

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        delay_minutes: [0, 5, 10, 15, 20, 25]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for update slot
        if: matrix.delay_minutes != 0
        shell: pwsh
        run: |
          Start-Sleep -Seconds ([int]"${{ matrix.delay_minutes }}" * 60)

      - name: Update pool temperature
        shell: pwsh
        run: |
          .\update-pool-temperature.ps1 `
            -Email "${{ secrets.GOVEE_EMAIL }}" `
            -Password "${{ secrets.GOVEE_PASSWORD }}" `
            -Code "${{ secrets.GOVEE_CODE }}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-${{ github.run_id }}-${{ matrix.delay_minutes }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ matrix.delay_minutes }}

  deploy-pages:
    if: github.event_name == 'push'
    runs-on: windows-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update pool temperature
        shell: pwsh
        run: |
          .\update-pool-temperature.ps1 `
            -Email "${{ secrets.GOVEE_EMAIL }}" `
            -Password "${{ secrets.GOVEE_PASSWORD }}" `
            -Code "${{ secrets.GOVEE_CODE }}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  restart-updater:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    needs: update-and-deploy
    steps:
      - name: Start next updater run
        shell: pwsh
        env:
          WORKFLOW_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WORKFLOW_DISPATCH_TOKEN)) {
            Write-Host "WORKFLOW_DISPATCH_TOKEN is not set, so this run cannot start the next updater run."
            exit 0
          }

          $headers = @{
            "Accept" = "application/vnd.github+json"
            "Authorization" = "Bearer $env:WORKFLOW_DISPATCH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{ ref = "main" } | ConvertTo-Json -Compress
          Invoke-RestMethod `
            -Method Post `
            -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pool-temperature.yml/dispatches" `
            -Headers $headers `
            -Body $body `
            -ContentType "application/json"
