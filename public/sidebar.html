<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pool Temp</title>

  <style>
    html,
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 118px !important;
      overflow: hidden !important;
      background: transparent !important;
      font-family: Arial, Helvetica, sans-serif;
      color: #152633;
    }

    * {
      box-sizing: border-box;
    }

    .widget {
      width: 100%;
      height: 118px;
      margin: 0 !important;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-align: center;

      background: transparent !important;
      border: 0 !important;
      outline: 0 !important;
      box-shadow: none !important;
    }

    .label {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 700;
      color: #152633;
    }

    .temp {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      text-overflow: clip;
      white-space: nowrap;
      font-size: 42px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0;
      color: #0d6f8f;
    }

    .meta {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      line-height: 1.2;
      color: #5d7180;
    }

    .meta.stale {
      color: #9a5d15;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <section class="widget" aria-live="polite">
    <div class="label">Pool Temp</div>
    <div class="temp" id="temp">--.-°F</div>
    <div class="meta" id="meta">Loading</div>
  </section>

  <script>
    async function loadTemperature() {
      const tempEl = document.getElementById("temp");
      const metaEl = document.getElementById("meta");

      try {
        const response = await fetch("pool-temperature.json?ts=" + Date.now(), {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Temperature file unavailable");
        }

        const data = await response.json();

        if (data.tempF === undefined || data.tempF === null || isNaN(Number(data.tempF))) {
          throw new Error("Invalid temperature value");
        }

        tempEl.textContent = Number(data.tempF).toFixed(1) + "°F";

        const date = data.lastReadingAt || data.updatedAt;
        metaEl.classList.remove("stale");

        if (date) {
          const readingDate = new Date(date);
          const ageMinutes = Math.max(
            0,
            Math.round((Date.now() - readingDate.getTime()) / 60000)
          );

          let ageLabel;

          if (ageMinutes < 1) {
            ageLabel = "just now";
          } else if (ageMinutes < 60) {
            ageLabel = ageMinutes + " min ago";
          } else {
            const ageHours = Math.round(ageMinutes / 60);
            ageLabel = ageHours + (ageHours === 1 ? " hr ago" : " hrs ago");
          }

          metaEl.textContent = "Updated " + ageLabel;

          if (ageMinutes > 90) {
            metaEl.classList.add("stale");
          }
        } else {
          metaEl.textContent = "";
        }
      } catch (error) {
        tempEl.textContent = "--.-°F";
        metaEl.textContent = "Unavailable";
        metaEl.classList.add("stale");
      }
    }

    loadTemperature();
    setInterval(loadTemperature, 60000);
  </script>
</body>
</html>
